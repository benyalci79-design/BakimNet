<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekipmanlar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">

    <header class="topbar">
        <img
            src="assets/logo-removebg-preview (1).png"
            alt="BakımNet logosu"
            class="site-logo"
        >

        <div class="user-info">
            <span>Yönetici</span>
            <button id="logoutButton">Çıkış Yap</button>
        </div>
    </header>

    <div class="layout">

        <aside id="adminNav" class="sidebar"></aside>

        <main class="content">
            <h1>Ekipmanlar</h1>

            <form id="equipmentForm" class="equipment-form">
                <h2>Yeni Ekipman Ekle</h2>

                <input
                    type="text"
                    id="code"
                    placeholder="Ekipman kodu"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Ekipman adı"
                    required
                >

                <input
                    type="text"
                    id="location"
                    placeholder="Konum"
                    required
                >

                <button type="submit">Ekipman Ekle</button>

                <p id="equipmentMessage"></p>
            </form>

            <section
                id="equipmentList"
                class="equipment-list"
            ></section>
        </main>

    </div>

    <script src="js/admin-nav.js"></script>
    <script src="js/equipment.js"></script>

</body>
</html>
